[package]
name = "pluck"
version = "0.1.0"
edition = "2021"
description = "Pluck: a discrete probabilistic programming language with lazy knowledge compilation"
license = "MIT"

[dependencies]
rsdd = { path = "vendor/rsdd" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ordered-float = { version = "5.3.0", features = ["serde"] }
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
itertools = "0.14.0"
indenter = "0.3.4"
rand_distr = "0.6.0"
num-traits = "0.2.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[lib]
name = "pluck"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pluck"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
